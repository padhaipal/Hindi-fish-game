# Builds the LIFTeracy teacher app (lifteracy-app/) into an installable APK.
# Download it from the run's "Artifacts" section (lifteracy-debug-apk).
name: LIFTeracy Android APK

on:
  push:
    paths:
      - "lifteracy-app/**"
      - ".github/workflows/lifteracy-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifteracy-app
    env:
      # Optional repository variables (Settings → Secrets and variables →
      # Actions → Variables) to point the app at a different STT server.
      VITE_STT_SERVER_URL: ${{ vars.LIFTERACY_STT_URL }}
      VITE_STT_ACCESS_CODE: ${{ vars.LIFTERACY_STT_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifteracy-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle
      # fetches any missing platform itself.

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: lifteracy-app/android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk lifteracy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifteracy-debug-apk
          path: lifteracy-app/lifteracy.apk
