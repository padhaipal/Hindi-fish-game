# Builds the LIFTeracy teacher app (lifteracy-app/) into an installable APK
# and publishes it as the latest release, so a phone can download it from:
#   https://github.com/padhaipal/Hindi-fish-game/releases/latest/download/lifteracy.apk
name: LIFTeracy Android APK

on:
  push:
    paths:
      - "lifteracy-app/**"
      - ".github/workflows/lifteracy-android.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifteracy-app
    env:
      # Optional repository variables (Settings → Secrets and variables →
      # Actions → Variables) to point the app at a different STT server.
      VITE_STT_SERVER_URL: ${{ vars.LIFTERACY_STT_URL }}
      VITE_STT_ACCESS_CODE: ${{ vars.LIFTERACY_STT_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifteracy-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle
      # fetches any missing platform itself.

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: lifteracy-app/android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk lifteracy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifteracy-debug-apk
          path: lifteracy-app/lifteracy.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lifteracy-app --yes --cleanup-tag || true
          gh release create lifteracy-app lifteracy.apk \
            --target "$GITHUB_SHA" --latest \
            --title "LIFTeracy app (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. On the phone, open https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lifteracy.apk and install it."
